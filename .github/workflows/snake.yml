name: contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF6A00&color_dots=#ebedf0,#ffd6b8,#ffae70,#ff8a33,#ff6a00
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8A33&color_dots=#161b22,#4a2a14,#8a4513,#c85f12,#ff8a33
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
